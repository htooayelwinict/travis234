[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travis234"
version = "2.5.3"
description = "Terminal coding agent with persistent sessions and bounded tool execution."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3>=1.35,<2",
  "google-auth>=2.35,<3",
  "httpx>=0.27",
  "jsonschema>=4.23,<5",
  "psutil>=6.1",
  "PyYAML>=6,<7",
  "websockets>=15,<18",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.59",
]

[dependency-groups]
coverage-test = [
  "travis234-mcp-adapter",
]
dev = [
  "bandit>=1.8,<2",
  "build>=1,<2",
  "coverage>=7,<8",
  "pip-audit>=2.9,<3",
  "pyright>=1.1,<2",
  "pytest>=8,<10",
  "radon>=6,<7",
  "ruff>=0.12,<1",
  "twine>=6,<7",
]

[tool.uv.sources]
travis234-mcp-adapter = { path = "packages/travis234-mcp-adapter" }

[project.scripts]
travis234 = "travis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["travis*"]

[tool.setuptools.package-data]
"travis.coding_agent" = ["export_html_assets/vendor/*.js"]
"travis.ai" = ["builtin_models.json"]
"travis" = [
  "resources/**/*.md",
  "resources/skills/**/*.py",
  "resources/roles/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
