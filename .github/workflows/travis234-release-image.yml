name: travis234 release image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build into the image"
        required: false
        default: "main"
      image_tag:
        description: "GHCR image tag"
        required: false
        default: "production"
      promote_production:
        description: "Retag an already published image_tag as production"
        required: false
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/travis234

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.promote_production != true }}
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
      TERM: xterm-256color
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync
      - name: Run Python tests
        run: >-
          PYTHONPATH=. uv run
          --with "pytest>=8,<10"
          --with "./packages/travis234-mcp-adapter"
          pytest -q -p no:cacheprovider tests
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Test npm launcher
        run: npm --prefix packages/travis234-cli test
      - name: Verify npm package
        run: npm --prefix packages/travis234-cli run pack:dry-run

  image-smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.promote_production != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.ref_name }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build no-cache smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          load: true
          push: false
          no-cache: true
          tags: travis234:hardening-smoke
      - name: Run installed image smoke
        run: python evals/container_smoke.py --image travis234:hardening-smoke

  build-and-push:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.promote_production != true }}
    needs: [test, image-smoke]
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.event.release.tag_name || 'production' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.ref_name }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Travis234 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          push: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  promote-production:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_production == true }}
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified image to production
        run: >-
          docker buildx imagetools create
          --tag "${IMAGE_NAME}:production"
          "${IMAGE_NAME}:${IMAGE_TAG}"
