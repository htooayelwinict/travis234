name: Scheduled dependency audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-locked-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Sync locked environment
        run: uv sync --locked --all-extras --dev
      - name: Audit locked dependencies
        run: |
          audit_requirements="$RUNNER_TEMP/travis234-audit-requirements.txt"
          uv export --locked --all-extras --dev --no-emit-project --no-hashes --format requirements-txt --output-file "$audit_requirements"
          uv run --locked --all-extras --dev pip-audit --strict --requirement "$audit_requirements"
